name: Build and Deploy SIKALANSIA

'on':
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-server:
    runs-on: ubuntu-latest
    outputs:
      image_name: ${{ steps.meta.outputs.image_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lower case owner name
        id: meta
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image_name=ghcr.io/$OWNER_LC/sikalansia-server" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Server Image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image_name }}:latest
            ${{ steps.meta.outputs.image_name }}:${{ github.sha }}

  build-client:
    runs-on: ubuntu-latest
    outputs:
      image_name: ${{ steps.meta.outputs.image_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lower case owner name
        id: meta
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image_name=ghcr.io/$OWNER_LC/sikalansia-client" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Client Image
        uses: docker/build-push-action@v6
        with:
          context: ./client
          file: ./client/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image_name }}:latest
            ${{ steps.meta.outputs.image_name }}:${{ github.sha }}

  deploy:
    needs: [build-server, build-client]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Secrets Presence
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY || secrets.TS_AUTHKEY || secrets.TAILSCALE_AUTH_KEY || secrets.TS_KEY }}
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          if [ -z "$TS_AUTHKEY" ]; then
            echo "::error title=Missing Secret::TAILSCALE_AUTHKEY is empty! Please add it in https://github.com/WEBIND-it/SIKALANSIA/settings/secrets/actions under 'Repository secrets'"
          else
            echo "✓ Tailscale Auth Key detected (characters: ${#TS_AUTHKEY})"
          fi
          if [ -z "$SSH_KEY" ]; then
            echo "::error title=Missing Secret::SERVER_SSH_KEY is empty! Please add it in Repository secrets."
          else
            echo "✓ SERVER_SSH_KEY detected"
          fi

      - name: Connect GitHub runner to Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY || secrets.TS_AUTHKEY || secrets.TAILSCALE_AUTH_KEY || secrets.TS_KEY }}

      - name: Configure SSH
        env:
          KNOWN_HOSTS: ${{ secrets.SERVER_SSH_KNOWN_HOSTS }}
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          if [ -n "$KNOWN_HOSTS" ]; then
            printf '%s\n' "$KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
            chmod 600 ~/.ssh/known_hosts
          fi

          # Clean Windows \r carriage returns and ensure trailing newline for OpenSSL 3.0 libcrypto
          if echo "$SSH_KEY" | grep -q "BEGIN"; then
            printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          else
            echo "$SSH_KEY" | base64 -d | tr -d '\r' > ~/.ssh/id_ed25519
          fi
          echo "" >> ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          # Validate key format
          ssh-keygen -y -f ~/.ssh/id_ed25519

      - name: Deploy to Home Server over Tailscale
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REMOTE_DIR="/home/deploy/projects/sikalansia"
          SSH_CMD="ssh -i /home/runner/.ssh/id_ed25519 -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15"
          SCP_CMD="scp -i /home/runner/.ssh/id_ed25519 -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15"

          # 1. Pastikan folder remote ada
          $SSH_CMD "$SERVER_USER@$SERVER_HOST" "mkdir -p $REMOTE_DIR"

          # 2. Salin docker-compose.prod.yml ke server
          $SCP_CMD docker-compose.prod.yml "$SERVER_USER@$SERVER_HOST:$REMOTE_DIR/docker-compose.yml"

          # 3. Pull image dan jalankan container
          $SSH_CMD "$SERVER_USER@$SERVER_HOST" \
            "cd $REMOTE_DIR && \
             export IMAGE_OWNER=$OWNER_LC && \
             export IMAGE_TAG=$IMAGE_TAG && \
             docker compose pull && \
             docker compose up -d --remove-orphans"
